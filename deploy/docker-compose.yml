name: gordyar

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gym_saas']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    logging: *default-logging
    networks: [gordyar_internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *default-logging
    networks: [gordyar_internal]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: gordyar-backend:local
    restart: unless-stopped
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://gym_app:${POSTGRES_APP_PASSWORD}@postgres:5432/gym_saas?schema=public
      DATABASE_ADMIN_URL: postgresql://gym_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/gym_saas?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      PLATFORM_SECRETS_KEY: ${PLATFORM_SECRETS_KEY:?PLATFORM_SECRETS_KEY is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-default}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      CORS_ORIGIN: https://${DOMAIN:-gordyar.ir}
      PUBLIC_API_ORIGIN: https://${API_DOMAIN:-api.gordyar.ir}
      APP_WEB_ORIGIN: ${APP_WEB_ORIGIN:-https://app.gordyar.ir}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-https://app-api.gordyar.ir/api/v1/payments/zarinpal/callback}
      LOCAL_UPLOADS_ENABLED: ${LOCAL_UPLOADS_ENABLED:-true}
      PORT: 3000
      NODE_ENV: production
    volumes:
      - uploads_data:/app/.local/uploads
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/v1/health', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    logging: *default-logging
    networks: [gordyar_internal]

  worker:
    image: gordyar-backend:local
    restart: unless-stopped
    init: true
    command: ['node', 'dist/main-worker.js']
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://gym_app:${POSTGRES_APP_PASSWORD}@postgres:5432/gym_saas?schema=public
      DATABASE_ADMIN_URL: postgresql://gym_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/gym_saas?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PLATFORM_SECRETS_KEY: ${PLATFORM_SECRETS_KEY:?PLATFORM_SECRETS_KEY is required}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      KAVENEGAR_ALLOWED_RECIPIENTS: ${KAVENEGAR_ALLOWED_RECIPIENTS:-}
      KAVENEGAR_DRY_RUN: ${KAVENEGAR_DRY_RUN:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      NODE_ENV: production
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *default-logging
    networks: [gordyar_internal]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN:-api.gordyar.ir}/api/v1
        NEXT_PUBLIC_WS_URL: https://${API_DOMAIN:-api.gordyar.ir}
    image: gordyar-frontend:local
    restart: unless-stopped
    init: true
    depends_on:
      backend: { condition: service_healthy }
    environment:
      API_BASE_URL: http://backend:3000/api/v1
      HOSTNAME: 0.0.0.0
      DEMO_MODE: 'false'
      NEXT_PUBLIC_DEMO_MODE: 'false'
      NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS: 'false'
    expose: ['3001']
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001', r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    logging: *default-logging
    networks: [gordyar_internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:-gordyar.ir}
      API_DOMAIN: ${API_DOMAIN:-api.gordyar.ir}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *default-logging
    networks: [gordyar_internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGDATABASE: gym_saas
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup.sh:/usr/local/bin/gordyar-backup:ro
      - backups_data:/backups
      - uploads_data:/uploads:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/gordyar-backup']
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *default-logging
    networks: [gordyar_internal]

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backups_data:
  caddy_data:
  caddy_config:

networks:
  gordyar_internal:
    driver: bridge
