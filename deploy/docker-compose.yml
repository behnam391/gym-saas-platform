version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_saas
      POSTGRES_USER: gym_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gym_app -d gym_saas']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gym_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?error}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gym_net]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://gym_app:${POSTGRES_PASSWORD}@postgres:5432/gym_saas?schema=public
      DATABASE_ADMIN_URL: postgresql://gym_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/gym_saas?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?error}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?error}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?error}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-default}
      CORS_ORIGIN: ${PUBLIC_FRONTEND_URL}
      PORT: 3000
      NODE_ENV: production
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/v1/tenants', r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [gym_net]

  # Same image as `backend`, different process — consumes the
  # `notifications` BullMQ queue (SMS/Email dispatch). Kept as an
  # independent container so a slow/down SMS gateway never affects API
  # request latency or restarts the API itself.
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/main-worker.js']
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      NODE_ENV: production
    networks: [gym_net]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}/api/v1
        NEXT_PUBLIC_WS_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    depends_on: [backend]
    expose: ['3001']
    networks: [gym_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [gym_net]

volumes:
  postgres_data:
  redis_data:

networks:
  gym_net:
    driver: bridge
